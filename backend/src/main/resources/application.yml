server:
  port: ${PORT:8080}
  error:
    include-message: never

spring:
  application:
    name: shikshasetu-backend
  config:
    # Optional local overrides (JWT_SECRET, DATABASE_URL, ...). backend/.env is git-ignored.
    import: optional:file:.env[.properties]
  profiles:
    # "dev" = embedded H2 file database (no install needed). Use "postgres" for PostgreSQL.
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 50
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    # Must be at least 32 characters. If empty, a random key is generated at startup
    # (sessions then do not survive a backend restart). Always set it outside local dev.
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    timeout-ms: ${AI_SERVICE_TIMEOUT_MS:3000}
  timezone: ${APP_TIMEZONE:Asia/Kolkata}
  seed:
    enabled: ${SEED_ENABLED:true}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/shikshasetu;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  h2:
    console:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/shikshasetu}
    username: ${DATABASE_USERNAME:shikshasetu}
    password: ${DATABASE_PASSWORD:}
