server {
    listen 80;
    root /usr/share/nginx/html;

    # The frontend calls /api on its own origin, as with the Vite proxy in development.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The service worker and manifest must be revalidated so app updates reach offline users.
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

    # Content-hashed build output can be cached for a long time.
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

    # Client-side routes (/student/..., /teacher/...) fall back to the SPA shell.
    location / { try_files $uri /index.html; }
}
