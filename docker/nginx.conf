server {
    listen 80;
    root /usr/share/nginx/html;

    # The frontend calls /api on its own origin, as with the Vite proxy in development.
    location /api/ {
        proxy_pass http://backend:8080;
        # $http_host keeps the port: Spring compares Host with the browser's Origin, and a
        # mismatch (localhost vs localhost:8081) turns same-origin POSTs into rejected CORS requests.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The service worker and manifest must be revalidated so app updates reach offline users.
    location = /sw.js { add_header Cache-Control "no-cache"; }
    # nginx's mime.types has no .webmanifest entry.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Content-hashed build output can be cached for a long time.
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

    # Client-side routes (/student/..., /teacher/...) fall back to the SPA shell.
    location / { try_files $uri /index.html; }
}
